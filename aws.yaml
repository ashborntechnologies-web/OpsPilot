AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ConvDeploy bootstrap — creates the platform access role that lets ConvDeploy
  manage deployment infrastructure in this AWS account.

Parameters:
  ConvDeployAccountId:
    Type: String
    Description: The AWS account ID of the ConvDeploy platform (provided in the UI).

Resources:
  ConvDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ConvDeployPlatformRole
      Description: Assumed by ConvDeploy to manage ECS, ECR, CodeBuild and networking.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${ConvDeployAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: convdeploy
      Policies:
        - PolicyName: ConvDeployPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action: cloudformation:*
                Resource: !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/cd-*'
              - Sid: ECR
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:GetAuthorizationToken
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutLifecyclePolicy
                Resource: '*'
              - Sid: ECS
                Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:DeleteCluster
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeServices
                  - ecs:DescribeClusters
                  - ecs:DescribeTaskDefinition
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:ListTagsForResource
                  - ecs:TagResource
                Resource: '*'
              - Sid: CodeBuild
                Effect: Allow
                Action:
                  - codebuild:CreateProject
                  - codebuild:DeleteProject
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:ListBuildsForProject
                  - codebuild:UpdateProject
                Resource: '*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:PutRetentionPolicy
                Resource: '*'
              - Sid: ElasticLoadBalancing
                Effect: Allow
                Action:
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:ModifyListener
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:DeregisterTargets
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:AddTags
                Resource: '*'
              - Sid: VPC
                Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:ModifyVpcAttribute
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeAvailabilityZones
                  - ec2:CreateTags
                Resource: '*'
              - Sid: IAMForInfra
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                  - iam:TagRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/cdrole-*'
              - Sid: DiscoveryReadOnly
                Effect: Allow
                # Read-only describe/list calls used by infrastructure discovery
                # (internal/discovery) to inventory existing resources. Without these the
                # RDS/ElastiCache/Lambda/S3/SQS scanners silently skip and the inventory is
                # incomplete with no error surfaced to the user.
                Action:
                  - rds:DescribeDBInstances
                  - rds:ListTagsForResource
                  - elasticache:DescribeCacheClusters
                  - elasticache:ListTagsForResource
                  - lambda:ListFunctions
                  - lambda:ListTags
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketTagging
                  - sqs:ListQueues
                  - sqs:GetQueueAttributes
                  - sqs:ListQueueTags
                Resource: '*'
              - Sid: CostExplorer
                Effect: Allow
                # Cost intelligence (project cost summary + daily-summary cost change).
                Action:
                  - ce:GetCostAndUsage
                Resource: '*'
              - Sid: STS
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'

Outputs:
  RoleArn:
    Value: !GetAtt ConvDeployRole.Arn
    Description: Paste this ARN into ConvDeploy to complete AWS connection.
  ExternalId:
    Value: convdeploy
    Description: External ID is already configured — no action needed.
